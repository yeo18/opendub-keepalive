name: Keepalive fallback

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - name: Start the long keepalive run if none is active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          active=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/yeo18/opendub-keepalive/actions/workflows/keepalive.yml/runs?status=in_progress" \
            | jq '.workflow_runs | length')
          if [ "$active" -eq 0 ]; then
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/yeo18/opendub-keepalive/actions/workflows/keepalive.yml/dispatches \
              -d '{"ref":"main"}'
          fi
