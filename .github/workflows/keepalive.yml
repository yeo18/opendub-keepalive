name: Keep OpenDub API warm

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Number of pings before re-dispatching"
        required: false
        default: "55"
      interval_seconds:
        description: "Seconds between pings"
        required: false
        default: "300"

permissions:
  actions: write
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Keep the API warm
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '55' }}
          INTERVAL_SECONDS: ${{ github.event.inputs.interval_seconds || '300' }}
        run: |
          for i in $(seq 1 "$ITERATIONS"); do
            curl --fail --silent --show-error --max-time 120 \
              https://opendub-api.onrender.com/api/health || true
            if [ "$i" -lt "$ITERATIONS" ]; then
              sleep "$INTERVAL_SECONDS"
            fi
          done
      - name: Check the public frontend proxy
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 120 \
            https://opendub.vercel.app/api/health
      - name: Schedule the next keepalive run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yeo18/opendub-keepalive/actions/workflows/keepalive.yml/dispatches \
            -d '{"ref":"main"}'
